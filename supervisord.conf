[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700
chown=ubuntu:ubuntu

[supervisord]
nodaemon=false
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log
user=ubuntu
loglevel=debug

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:fastapi]
directory=/home/ubuntu/VeeriveChatBot
command=/home/ubuntu/VeeriveChatBot/.venv/bin/uvicorn app:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=10
stdout_logfile=/var/log/fastapi_stdout.log
stderr_logfile=/var/log/fastapi_stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
user=ubuntu
environment=PATH="/home/ubuntu/VeeriveChatBot/.venv/bin:%(ENV_PATH)s"